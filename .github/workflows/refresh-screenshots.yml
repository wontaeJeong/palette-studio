name: Refresh UI screenshots

on:
  push:
    branches:
      - feat/refresh-ui-screenshots-20261103
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ui-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.repository == 'wontaeJeong/palette-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/palette-qa" playwright@1.62.1 --no-audit --no-fund
          "$RUNNER_TEMP/palette-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/palette-qa/node_modules" >> "$GITHUB_ENV"
      - name: Capture real pages and create source fingerprint
        run: |
          node scripts/capture-previews.cjs
          node scripts/check-screenshot-freshness.cjs
      - name: Commit refreshed screenshots back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/*.png previews/screenshots.json
          if git diff --cached --quiet; then
            echo "Screenshots already current."
          else
            git commit -m "docs(previews): refresh real browser screenshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
