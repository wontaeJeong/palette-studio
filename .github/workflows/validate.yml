name: Validate palette kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts and regenerate contracts
        run: |
          node --check app.js
          node --check font-loader.js
          node --check icons.js
          node --check handoff.js
          node --check data/handoff-core.js
          node scripts/build-icons-react.mjs --check
          node scripts/check-handoff-schemas.cjs
          node scripts/test-design-handoff.cjs
          node scripts/test-navigation-designs.cjs
          node scripts/test-design-concepts.cjs
          node scripts/test-ui-libraries.cjs
          node --test scripts/test-library-metrics.cjs
          node scripts/check-icons.cjs
          node scripts/check-screenshot-freshness.cjs
          python3 scripts/vendor_fonts.py
          python3 scripts/audit-fonts.py
          python3 scripts/build.py
          node scripts/audit.mjs
          python3 scripts/bundle.py
      - name: Verify generated sources are committed
        run: git diff --exit-code -- css data/catalog.js data/font-catalog.js data/fonts.json data/palettes.json data/profile.schema.json START-HERE.html
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/palette-qa" playwright@1.62.1
          "$RUNNER_TEMP/palette-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/palette-qa/node_modules" >> "$GITHUB_ENV"
      - name: Verify selection flow and font fallback
        run: |
          node scripts/check-studio-flow.cjs
          node scripts/check-fonts.cjs
          node scripts/check-icon-studio.cjs
          node scripts/check-handoff-browser.cjs
          node scripts/check-navigation-library-integration.cjs
          node scripts/check-library-metrics-browser.cjs
          node scripts/check-library-export-summary.cjs
          LIBRARY_ID=base-ui node scripts/check-library-browser.cjs
  react-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React icon package dependencies
        run: npm install --prefix packages/icons-react --no-audit --no-fund
      - name: Verify React build, SSR, a11y and tree-shaking
        run: npm test --prefix packages/icons-react
      - name: Verify distributable tarball
        run: npm pack ./packages/icons-react --dry-run
