name: Validate palette kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned studio toolchain
        run: npm ci --no-audit --no-fund
      - name: Check scripts and regenerate contracts
        run: |
          npm test
          node --check app.js
          node --check font-loader.js
          node --check icons.js
          node --check handoff.js
          node --check data/handoff-core.js
          node scripts/build-icons-react.mjs --check
          node scripts/check-icons.cjs
          python3 scripts/vendor_fonts.py
          python3 scripts/audit-fonts.py
          npm run build
          node scripts/audit.mjs
          npm run check:build
          node scripts/check-screenshot-freshness.cjs
      - name: Verify generated sources are committed
        run: git diff --exit-code -- css data/catalog.js data/font-catalog.js data/fonts.json data/palettes.json data/profile.schema.json index.html assets/studio.js assets/library-preview-LICENSES.txt START-HERE.html
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned studio and library QA dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix examples/library-preview --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build both distributions and typecheck generated library recipes
        run: |
          npm run typecheck
          npm run build
          npm test --prefix examples/library-preview
      - name: Verify React, split distribution and all browser regressions
        run: |
          npm run test:studio
          npm run test:distributions
          node scripts/check-dashboard-layouts.cjs
          node scripts/check-studio-flow.cjs
          node scripts/check-fonts.cjs
          node scripts/check-icon-studio.cjs
          node scripts/check-handoff-browser.cjs
          node scripts/check-component-concepts.cjs
          node scripts/check-component-gallery.cjs
          node scripts/check-library-browser.cjs
          node scripts/check-library-selection.cjs
          node scripts/check-navigation-library-integration.cjs
          node scripts/check-library-metrics-browser.cjs
          node scripts/check-library-export-summary.cjs
  react-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React icon package dependencies
        run: npm install --prefix packages/icons-react --no-audit --no-fund
      - name: Verify React build, SSR, a11y and tree-shaking
        run: npm test --prefix packages/icons-react
      - name: Verify distributable tarball
        run: npm pack ./packages/icons-react --dry-run
